name: Update tide data
# Weekly tide data refresh

on:
  schedule:
    # Every Monday at 11:00 UTC (6/7am Florida time)
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tide alert data
        run: python3 scripts/fetch_tides.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tide_alerts_daily.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update tide data ($(date -u +%Y-%m-%d))"
            git push
          fi